<div class="experience-list">{% for experience in site.data.profile.research_experience %}<article class="experience-entry"><div class="entry-heading"><h3>{{ experience.lab }}</h3><span class="entry-date">{{ experience.period }}</span></div><p class="experience-institution">{{ experience.institution }}</p><p>{{ experience.role }}</p><p class="entry-advisor">Advisor: {% if experience.advisor_url %}<a href="{{ experience.advisor_url }}">{{ experience.advisor }}</a>{% else %}{{ experience.advisor }}{% endif %}</p></article>{% endfor %}</div>
