<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0;url={{ page.redirect_to | relative_url }}">
    <title>Page moved | {{ site.title }}</title>
    <script>
      (function () {
        var destination = {{ page.redirect_to | relative_url | jsonify }};
        if (window.location.hash) destination = destination.split("#")[0] + window.location.hash;
        window.location.replace(destination);
      }());
    </script>
  </head>
  <body><p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to {{ page.redirect_label }}.</a></p></body>
</html>
