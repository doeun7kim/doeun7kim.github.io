- id: julaengrang
  title: 'Julhaengrang: Subway Crowding Avoidance with ML & Pareto Optimization'
  short_title: A less crowded commute.
  summary: Station-specific ML forecasts and Pareto optimization for subway crowding avoidance.
  period: Summer 2026
  category: ml
  category_label: Machine learning
  metric: '91'
  metric_label: station–wait options
  tags: [Machine learning, Pareto optimization, Urban mobility]
  details:
    - Built an ML-based station-avoidance service to address unavailable real-time crowding data, training station-specific models on five-minute observations across 7 stations to forecast passenger inflow and crowding probabilities.
    - Combined ML forecasts with route estimates and Pareto optimization to compare 91 station–wait options by crowding, travel time, walking, and transfers.
    - The project was selected for further development by KT and partner organizations.
- id: interactive-3d-graphics
  title: Interactive 3D Graphics System with OpenGL & GLSL
  short_title: A scene from every angle.
  summary: An interactive 3D world with multi-camera navigation, animation, and custom shaders.
  period: Spring 2026
  category: systems
  category_label: Computer graphics
  metric: '7'
  metric_label: CCTV viewpoints
  tags: [C++, OpenGL, GLSL, Computer graphics]
  details:
    - Developed an interactive 3D scene with multi-camera navigation, Catmull–Rom motion, animated-object tracking, and a seven-view CCTV interface using C++ and OpenGL.
    - Implemented Phong lighting, texture mapping, alpha blending, dynamic objects, and custom GLSL effects including a holographic Menger cube and spiral image transition.
- id: nyc-airbnb
  title: Statistical Modeling of NYC Airbnb Prices
  short_title: What shapes a stay’s price?
  summary: Statistical modeling of NYC Airbnb listings to understand the drivers of rental prices.
  period: Spring 2026
  category: data
  category_label: Data analysis
  metric: '19,995'
  metric_label: cases analyzed
  tags: [SAS, Regression, ANOVA, Statistical modeling]
  details:
    - Analyzed NYC Airbnb listings in SAS, engineering price, availability, property, and host features and applying hypothesis tests, categorical data analysis, ANOVA, and regression diagnostics.
    - Built and compared multiple-regression and variable-selection models on 19,995 cases; the full model explained 41.59% of log-price variance and identified guest capacity, borough, and room type as the strongest predictors.
